[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "congress-trades"
dynamic = ["version"]
description = "Scrape U.S. Senate and House STOCK Act stock-trade disclosures into JSON or CSV."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anabolic Capital" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "pdfplumber>=0.10"]
keywords = ["congress", "senate", "house", "stock-act", "insider-trading", "scraper", "finance", "ptr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/anabolic-capital/congress-trades"
Issues = "https://github.com/anabolic-capital/congress-trades/issues"

[project.scripts]
congress-trades = "congress_trades:main"

[tool.setuptools]
py-modules = ["congress_trades"]

[tool.setuptools.dynamic]
version = { attr = "congress_trades.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
